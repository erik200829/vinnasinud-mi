{% extends "base.html" %}
{% block title %}Innskráning{% endblock %}
{% block content %}
  <h1>Innskráning</h1>
  <form method="post">
    <label>Netfang</label>
    <input class="form-input" name="email" type="email" required>

    <button class="btn" type="submit">Skrá inn</button>
  </form>
{% endblock %}
