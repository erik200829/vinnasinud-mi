{% extends 'base.html' %}
{% block content %}
<h2>Þættir i flokki: {{ genre }}</h2>
<div class="grid">
  {% for item in shows %}
    <article>
      <h3>{{ item['name'] }}</h3>
      <a href="{{ url_for('show', id=item['id']) }}">
        {% if item['image'] %}<img src="{{ item['image']['medium'] }}" alt="{{ item['name'] }}">{% endif %}
      </a>
    </article>
  {% endfor %}
</div>
{% endblock %}
